<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Library - Readers</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- header with the menu -->
    <header>
        <h1>📚 Library Management System</h1>
        <nav>
            <a href="books.html">Books</a>
            <a href="authors.html">Authors</a>
            <a href="categories.html">Categories</a>
            <a href="readers.html" class="active">Readers</a>
            <a href="loans.html">Loans</a>
            <a href="database.html">Database</a>
        </nav>
        <!-- dark mode switch -->
        <label class="switch">
            <input type="checkbox" id="darkSwitch">
            <span class="slider"></span>
        </label>
    </header>

    <!-- page content -->
    <main>

        <h2>Readers</h2>

        <!-- CREATE / UPDATE: form -->
        <form id="form">
            <h3 id="formTitle">Add reader</h3>

            <label>Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email">

            <label>Phone</label>
            <input type="text" id="phone">

            <button type="submit">Save</button>
        </form>

        <!-- READ: table -->
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>

    </main>

    <!-- SQL library (sql.js, stored in the project) -->
    <script src="../js/lib/sql-wasm.js"></script>
    <!-- shared database code -->
    <script src="../js/db.js"></script>
    <!-- dark mode -->
    <script src="../js/theme.js"></script>
    <!-- code for this page -->
    <script src="../js/readers.js"></script>

</body>
</html>
