<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Library Book Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- header -->
    <h1>Library Book Manager</h1>

    <!-- CREATE / UPDATE: form to add or edit a book -->
    <form id="bookForm">
        <h2 id="formTitle">Add a new book</h2>

        <label>Title</label>
        <input type="text" id="title" required>

        <label>Author</label>
        <input type="text" id="author" required>

        <label>Year</label>
        <input type="number" id="year" required>

        <button type="submit">Save</button>
    </form>

    <!-- READ: table with all books -->
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Year</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="bookList"></tbody>
    </table>

    <!-- button to reset the database -->
    <button id="resetButton" class="reset">Reset database</button>

    <!-- SQL library (SQLite in the browser) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- my code -->
    <script src="app.js"></script>

</body>
</html>
