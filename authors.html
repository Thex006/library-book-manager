<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Library - Authors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- header with the menu -->
    <header>
        <h1>📚 Library Management System</h1>
        <nav>
            <a href="index.html">Books</a>
            <a href="authors.html" class="active">Authors</a>
            <a href="categories.html">Categories</a>
            <a href="readers.html">Readers</a>
            <a href="loans.html">Loans</a>
        </nav>
    </header>

    <!-- page content -->
    <main>

        <h2>Authors</h2>

        <!-- CREATE / UPDATE: form -->
        <form id="form">
            <h3 id="formTitle">Add author</h3>

            <label>Name</label>
            <input type="text" id="name" required>

            <label>Country</label>
            <input type="text" id="country">

            <button type="submit">Save</button>
        </form>

        <!-- READ: table -->
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Country</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>

        <!-- reset the example data -->
        <button class="reset" onclick="resetDatabase()">Reset database</button>

    </main>

    <!-- SQL library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- shared database code -->
    <script src="db.js"></script>
    <!-- code for this page -->
    <script src="authors.js"></script>

</body>
</html>
