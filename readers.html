<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Library - Readers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- header -->
    <h1>Library Management System</h1>

    <!-- menu -->
    <nav>
        <a href="index.html">Books</a>
        <a href="authors.html">Authors</a>
        <a href="categories.html">Categories</a>
        <a href="readers.html">Readers</a>
        <a href="loans.html">Loans</a>
    </nav>

    <h2>Readers</h2>

    <!-- CREATE / UPDATE: form -->
    <form id="form">
        <h3 id="formTitle">Add reader</h3>

        <label>Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email">

        <label>Phone</label>
        <input type="text" id="phone">

        <button type="submit">Save</button>
    </form>

    <!-- READ: table -->
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

    <!-- reset the example data -->
    <button class="reset" onclick="resetDatabase()">Reset database</button>

    <!-- SQL library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- shared database code -->
    <script src="db.js"></script>
    <!-- code for this page -->
    <script src="readers.js"></script>

</body>
</html>
