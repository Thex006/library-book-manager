{% extends "base.html" %}
{% block content %}
<!-- One form for both Add and Edit: if "book" exists we are editing -->
<h2>{{ "Edit book" if book else "Add a new book" }}</h2>
<form method="post" class="card">
  <label>Title <input name="title" value="{{ book.title if book else '' }}" required></label>
  <label>Author <input name="author" value="{{ book.author if book else '' }}" required></label>
  <label>Genre
    <select name="genre">
      {% for g in genres %}<option {% if book and g == book.genre %}selected{% endif %}>{{ g }}</option>{% endfor %}
    </select>
  </label>
  <label>Year <input name="year" type="number" min="1000" max="2100" value="{{ book.year if book else '' }}" required></label>
  <button>Save</button>
  <a href="/">Cancel</a>
</form>
{% endblock %}
