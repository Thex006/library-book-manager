<!DOCTYPE html>
<html>
<head>
    <title>Library Book Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- header -->
    <h1>Library Book Manager</h1>

    <!-- button to the add page -->
    <a href="/add" class="button">Add book</a>

    <!-- READ: table with all books -->
    <table>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
            <th>Actions</th>
        </tr>

        <!-- one row for each book -->
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.year }}</td>
            <td>
                <!-- UPDATE -->
                <a href="/edit/{{ book.id }}">Edit</a>
                <!-- DELETE -->
                <a href="/delete/{{ book.id }}" class="delete">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
