<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Library - Loans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- header -->
    <h1>Library Management System</h1>

    <!-- menu -->
    <nav>
        <a href="index.html">Books</a>
        <a href="authors.html">Authors</a>
        <a href="categories.html">Categories</a>
        <a href="readers.html">Readers</a>
        <a href="loans.html">Loans</a>
    </nav>

    <h2>Loans</h2>

    <!-- CREATE / UPDATE: form -->
    <form id="form">
        <h3 id="formTitle">Add loan</h3>

        <label>Book</label>
        <select id="book"></select>

        <label>Reader</label>
        <select id="reader"></select>

        <label>Loan date</label>
        <input type="date" id="loanDate" required>

        <label>Return date</label>
        <input type="date" id="returnDate">

        <button type="submit">Save</button>
    </form>

    <!-- READ: table -->
    <table>
        <thead>
            <tr>
                <th>Book</th>
                <th>Reader</th>
                <th>Loan date</th>
                <th>Return date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

    <!-- reset the example data -->
    <button class="reset" onclick="resetDatabase()">Reset database</button>

    <!-- SQL library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- shared database code -->
    <script src="db.js"></script>
    <!-- code for this page -->
    <script src="loans.js"></script>

</body>
</html>
